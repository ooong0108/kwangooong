<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Wedding Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="hero">

    <div class="hero-inner">

        <p class="small">
            WEDDING GALLERY
        </p>

        <h1>
            홍길동
            <span>&</span>
            김하나
        </h1>

        <p class="date">
            2027.03.27 SAT
        </p>

    </div>

</header>


<section class="intro">

    <h2>
        우리의 순간
    </h2>

    <p>

        가장 행복했던 순간을<br>
        함께 나누고 싶습니다.

    </p>

</section>


<section class="gallery">

    <div id="gallery"></div>

</section>


<div id="viewer">

    <span id="close">✕</span>

    <span id="prev">❮</span>

    <img id="viewerImage">

    <span id="next">❯</span>

    <div id="count"></div>

</div>


<script src="script.js"></script>

</body>
</html>
