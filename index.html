<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Wedding Gallery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- 배경 -->

<div class="background"></div>

<!-- 메인 -->

<main>

<section class="hero">

<p class="sub">Wedding Gallery</p>

<h1>

신랑 홍길동<br>
<span>&</span><br>
신부 김하나

</h1>

<p class="date">

2027.03.27 SAT

</p>

</section>

<!-- 소개 -->

<section class="intro">

<h2>우리의 순간</h2>

<p>

가장 행복했던 순간들을<br>
천천히 담았습니다.

</p>

</section>

<!-- 갤러리 -->

<section class="gallery">

<div class="grid">

<!-- 사진은 script.js에서 자동 생성 -->

</div>

</section>

</main>

<!-- 라이트박스 -->

<div id="lightbox">

<button id="close">

✕

</button>

<button id="prev">

❮

</button>

<img id="lightbox-image">

<button id="next">

❯

</button>

<div id="counter">

1 / 40

</div>

</div>

<script src="script.js"></script>

</body>
</html>
